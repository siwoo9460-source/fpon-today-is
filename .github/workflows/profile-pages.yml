name: Deploy FPON Pages

on:
  push:
    branches: ["main"]
    paths:
      - "profile.html"
      - "profile-photo.jpg"
      - "profile-og.jpg"
      - "index.html"
      - "style.css"
      - "daily/**"
      - ".github/workflows/profile-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare full site
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in ['profile-photo.jpg','profile-og.jpg']:
              src = Path(name).read_bytes()
              if src.startswith(b'\xff\xd8\xff'):
                  out = src
              else:
                  out = base64.b64decode(b''.join(src.split()))
              Path('_site', name).write_bytes(out)
          PY
          mkdir -p _site/profile
          cp profile.html _site/profile/index.html
          cp _site/profile-photo.jpg _site/profile/profile-photo.jpg
          cp _site/profile-og.jpg _site/profile/profile-og.jpg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
